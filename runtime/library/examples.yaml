- id: EX-PAY
  name: 付款安排
  category: 付款
  enabled: true
  baseline: 示例标准：预付款为合同价的20%，里程碑款50%，验收款30%，付款期限为收到合规发票后30日。
  definition: 检查付款触发条件是否客观明确，是否附带无法控制的第三方回款条件，尾款比例和期限是否可接受。以上比例为虚构示例，不代表任何公司的真实制度。
  industry: 通用
- id: EX-ACCEPT
  name: 验收标准与期限
  category: 验收
  enabled: true
  baseline: 示例标准：交付后15个工作日内书面验收，异议应具体列明不符合项，并约定整改与复验流程。
  definition: 检查标准、验收主体、期限、异议处理与逾期后果是否明确。期限为演示数据。
  industry: 通用
- id: EX-LIABILITY
  name: 违约责任
  category: 责任
  enabled: true
  baseline: 示例标准：迟延违约金每日按迟延部分价款0.03%计算，累计上限为该部分价款5%；责任上限与例外需明确。
  definition: 检查责任是否失衡、违约金是否重复累计、责任上限是否缺失。比例仅为虚构演示基线。
  industry: 通用
- id: EX-TERMINATE
  name: 解除与结算
  category: 解除
  enabled: true
  baseline: 示例标准：一般违约先给予15日补救期，解除时按已验收成果和合理已发生成本结算。
  definition: 检查单方任意解除、无补救期限、解除后拒绝支付已完成工作或资料交接不清的风险。期限为虚构演示数据。
  industry: 通用
